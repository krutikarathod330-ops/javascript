<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Arrays</h1>



<script>
var cars = ["Saab", "Volvo", "BMW",67,34,9.7];
document.write(cars+"<br>")


var cars = new Array("Saab", "Volvo", "BMW",45,67,23,57,23,67,78,34,56,677,878,12);

document.write(cars[1]+""+cars[2]+"<br>")


for(var i=0;i<cars.length;i++)
{

    document.write(cars[i]+"<br>")
}




</script>

</body>
</html>
