<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        /**
         **    e) decision making
 *         a) if else
 *    in this when the if condition is true it will execute the if body 
 * and when the if condition is false it will execute the else body.
 *        
 *  
         * 
         * 
         * **/

        var a = 10
        var b = 10

        if (a == b) {
            document.write("Hello")
        }
        else {
            document.write("World")
        }

    </script>
</body>

</html>
