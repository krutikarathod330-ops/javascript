        /**

 * 
 *  
         * 
         * 
         * **/

        var a = 10
        var b = 10
        var c = 56
        var d = 43

        if (a == b) {

            if (c>d) {
  document.write("World1")
            }
            else {

            }

        }

        else {
            document.write("World")
        }

    </script>
