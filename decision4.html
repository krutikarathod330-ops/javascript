<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        /**
         **    e) decision making
 *  
 *         
 *         d) switch case
 *     it is used to check multiple cases and in this to stop the flow of another case 
 * we need to apply break statement then that is called as switch case.
 *  
         * 
         * condition---> case
         * else ---> default
         * **/

        var a = 1

        switch(a)
        {
            case 1:{
                document.write("Hello")
                break
            }
            case 2:{
                document.write("Hello2")
                break
            }
            case 3:{
                document.write("Hello3")
                break
            }
            case 4:{
                document.write("Hello4")
                break
            }
            default:{
                   document.write("Hello5")
                break
            }
        }
        

    </script>
</body>

</html>
