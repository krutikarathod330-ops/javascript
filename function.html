<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /**
         *  
         *  function
         *   it is a block of a statement or code which is used to perform 
         * specific task then that is called as functions.
         * 
         * Type of function
         *  a) function with no argument and no return type.
         *  b) function with   argument and no return type.
         *  c) function with no argument and   return type.
         *  d) function with   argument and   return type.
         * 
         * 
         *  a) function defined
         *       which is used to defined the work flow of business logic.
         *  b) function call
         *     it help us to execute the function defined
         * 
         * 
         * **/


         //   a) function with no argument and no return type.



         function addition() // function defined
         { 
            var a=12
            var b=90
            document.write("addition="+(a+b)+"<br>")
         }

          function substraction() // function defined
         {
            var a=12
            var b=90
            document.write("substraction="+(a-b)+"<br>")
         }
 
         addition() // function call
         substraction()
          

    </script>
</body>
</html>
