<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        /**
         *  
         *  function
         *   it is a block of a statement or code which is used to perform 
         * specific task then that is called as functions.
         * 
         * Type of function
         *  a) function with no argument and no return type.
         *  b) function with   argument and no return type.
         *  c) function with no argument and   return type.
         *  d) function with   argument and   return type.
         * 
         * 
         *  a) function defined
         *       which is used to defined the work flow of business logic.
         *  b) function call
         *     it help us to execute the function defined
         * 
         *  c) argument
         *    when we pass the value from the parenthises or declare the variable into parenthise
         * then that is called as argument.
         * 
         * d) return 
         *    it is used to return the value from where the function is call.
         * **/


        //   d) function with   argument and   return type.



        function addition(a, b) // function defined
        {
            return a + b
        }

        document.write("Addition=" + addition(89, 67) + "<br>") // function call

        document.write("Addition=" + addition(4, 98) + "<br>")  // function call




    </script>
</body>

</html>
