<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /**
         * 
         * Variable : it is used to hold the value then that is called as variable.
         * DataType : which is used to defined the category of data then that is called
         * as datatype (integer,decimal,character)
         * 
         * var : it help us to declare the same variable multiple time 
         * in single file along with value override.
         *       var a=122

                  a=89
                  document.write(a+"<br>")
         * 
         * 
         * 
         * let : it does not allow us to declare the same variable in single file and allow
         * us to value override.
         * let a=122

             a=89
            document.write(a+"<br>")
         * 
         * const : it does not allow us to declare the same variable in single file along 
         * with value override.
         * 
         *    
         const a=122

         a=89
         document.write(a+"<br>")
         * 
         * */

         const a=122

         a=89
         document.write(a+"<br>")
 
    </script>
</body>
</html>
