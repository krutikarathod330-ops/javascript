<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /***
         * oop concept 
         *  
         * a) class and object
         * 
         * class 
         *   it is used to hold the variable and function then that is called as 
         * class.
         * 
         * object
         *  it help us to access the class variable and functions.
         * 
         * 
         * 
         * **/

         class AB
         {
            display()
            {
                document.write("Hello<br>")
            }
            addition(a,b)
            {
                return a+b
            }
         }

         var t=new AB()
         t.display()

         document.write("addition=",t.addition(12,34))
    </script>
</body>
</html>
