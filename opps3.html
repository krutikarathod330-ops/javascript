        /***
         * oop concept

         *  b) parametrize constructor
         *      the constructor which have argument then that is called as parametrize constructor.
         * 
         * 
         * **/

         class AB
         {
            constructor(a,b) // parametrize constructor
            {
                document.write((a+b)+"<br>")
            }
           
         }

         var tt=new AB(90,3) 
         
    </script>
