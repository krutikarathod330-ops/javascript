<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
     /**
      * 
      *  Relational operator
      * 
      *  a) == equal to  : it is used to check the value should be equal
      *  b) != not equal : it is used to check the value should not be equal
      *  c) < less then  : it is used to check the value should be less
      *  d) > greater then : it is used to check the value should be greater 
      *  e) <= less then equal : it used to check the value should be less then or equal 
      *  f) >= greater then equal : it used to check the value should be greater then or equal 
      *    
      * 
      * 
      * **/
 
      var a=12
      var b=9


      document.write((a==b)+"<br>")
      document.write((a!=b)+"<br>")
      document.write((a<=b)+"<br>")
      document.write((a>=b)+"<br>")
      document.write((a<b)+"<br>")
      document.write((a>b)+"<br>")
      
      
      
      
    </script>
</body>
</html>
